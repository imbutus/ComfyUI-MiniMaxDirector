[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-director"
version = "0.13.0"
description = "Timeline director for the MiniMax H3 video model in ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/imbutus/ComfyUI-MiniMaxDirector"
"Bug Tracker" = "https://github.com/imbutus/ComfyUI-MiniMaxDirector/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.comfy]
PublisherId = "imbutus"
DisplayName = "MiniMax Director"
requires-comfyui = ">=0.30.0"  # where the MiniMax H3 nodes landed

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
