[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-director"
version = "0.17.1"
description = """\
Direct MiniMax H3 on a timeline instead of cramming everything into one prompt box. Lay \
shots, camera moves and audio cues out on tracks, give every person, prop, place and look \
a card holding its reference picture, its description and its voice, and the node compiles \
the whole piece into the single structured prompt H3 actually reads -- the six-section \
reference format, task types, dialogue in the model's exact <d> form, frame anchors and \
on-screen text -- then hands the sampler its conditioning and a clip length it will \
accept. Ships as a complete workflow with a live compiled-prompt view and a linter.\
"""
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/imbutus/ComfyUI-MiniMaxDirector"
"Bug Tracker" = "https://github.com/imbutus/ComfyUI-MiniMaxDirector/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.comfy]
PublisherId = "imbutus"
DisplayName = "MiniMax Director"
requires-comfyui = ">=0.31.0"  # 0.30.0 has the H3 nodes; 0.31.0 has ModelSamplingAV,
                                # which the shipped workflow's Turbo path needs

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
